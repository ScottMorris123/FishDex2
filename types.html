<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FishDex • Browse by Type</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0b1620" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FishDex" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <link rel="mask-icon" href="icons/safari-pinned.svg" color="#0b1620" />
    <link rel="stylesheet" href="styles/app.css" />
    <script src="scripts/pwa.js"></script>
    <style>
      :root { --bg-deep:#0a121a; --stroke:rgba(255,255,255,0.1); --text:rgba(255,255,255,0.92); --muted:rgba(255,255,255,0.7); --shadow:0 10px 30px rgba(0,0,0,.45); }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      /* Paint the large page background on <html> so it always exists behind blurred/glass elements and grows with content */
      html { 
        background: radial-gradient(1200px 800px at 80% -10%, #143046 0%, rgba(20,48,70,0) 60%) no-repeat,
                    radial-gradient(1000px 700px at -10% 10%, #0f2738 0%, rgba(15,39,56,0) 60%) no-repeat,
                    linear-gradient(180deg, #0b1620 0%, #0a1118 100%) no-repeat;
        background-color:#0a1118; /* solid fallback so there is never white showing */
        min-height:100%;
      }
      body { margin:0; color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, sans-serif;
        background: transparent; min-height:100svh; overflow-x:hidden; }
      .frame { max-width:980px; margin:0 auto; padding: clamp(14px,2.5vw,24px); border-radius:22px; border:1px solid var(--stroke);
        background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.02)); box-shadow:var(--shadow); padding-top: calc(2.5vw + env(safe-area-inset-top)); }
      .topbar { position:sticky; top:0; display:flex; gap:12px; align-items:center; padding:12px 16px; border-radius:14px; border:1px solid var(--stroke);
        background: rgba(255,255,255,0.04); backdrop-filter: blur(8px); z-index:30; justify-content: space-between; }
      .brand { font-weight:700; font-size: clamp(18px,4vw,22px); }
      .back { display:inline-flex; gap:8px; align-items:center; border:1px solid var(--stroke); background: rgba(255,255,255,.05); border-radius:10px; padding:8px 12px; color:rgba(160,200,220,.9); text-decoration:none; }
      .group-selections { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:6px; margin-top:12px; }
      .card { border:1px solid var(--stroke); background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.03)); border-radius:16px; padding:6px; display:flex; gap:10px; align-items:center; position:relative; }
      .icon { width:48px; height:48px; border-radius:12px; display:grid; place-items:center; background: rgba(140,190,220,.06); border:1px solid var(--stroke); flex:0 0 auto; padding:6px; }
      .group-label { font-size:14px; font-weight:600; letter-spacing:.2px; }
      .group-description { font-size:10px; color:var(--muted); }
    </style>
  </head>
  <body>
    <main class="frame">
      <header class="topbar">
        <a class="back" id="backLink" href="./category.html" aria-label="Back to Category"><img src="icons/home.svg" alt="" width="24" height="24"/></a>
  <div id="title" class="brand">Browse by Type</div>
        <div style="flex:1"></div>
      </header>

      <article id="intro" style="opacity:.9; font-size:13px; margin-top:8px"></article>

  <section id="grid" class="group-selections"></section>

      <script>
        const params = new URL(location.href).searchParams;
        const cat = (params.get('category') || '').toLowerCase();
        const label = cat ? cat.charAt(0).toUpperCase()+cat.slice(1) : 'Category';
        document.getElementById('backLink').href = `category.html?category=${encodeURIComponent(cat)}`;
        document.getElementById('intro').textContent = `Browse types by common groups for ${label.toLowerCase()}.`;
  const grid = document.getElementById('grid');
  // lightweight placeholder so the page never looks empty while we load
  grid.innerHTML = '<div style="padding:10px;color:#9ec;opacity:.8;font-size:12px">Loading types…</div>';

        // New hierarchy: Category (game/commercial/bait) -> Water (fresh/brackish/salt) -> Habitat
        const WATER_HABITATS = {
          fresh: ['streams','lakes','caves'],
          brackish: ['estuaries_mangroves_marsh'],
          salt: ['coastal_nearshore','reef_fish','open_ocean_offshore']
        };
        const CATEGORY_FLAG = { game: 'gamefish', commercial: 'commercial', bait: 'bait' };

        function card(href, icon, label, desc) {
          const safeIcon = icon || 'icons/fish.svg';
          return `
          <article class="card" tabindex="0" role="link" aria-label="${label}">
            <div class="icon"><img src="${safeIcon}" alt="" onerror="this.src='icons/fish.svg'"/></div>
            <div>
              <div class="group-label">${label}</div>
              <div class="group-description">${desc}</div>
            </div>
            <a href="${href}" style="position:absolute;inset:0" aria-hidden="true"></a>
          </article>`;
        }

        // Resolve the first reachable URL from candidates (GET only; some dev servers mis-handle HEAD)
        async function resolve(pathCandidates){
          for(const p of pathCandidates){
            try{
              const res = await fetch(p,{method:'GET', cache:'no-store'});
              if(res.ok) return p;
            }catch{}
          }
          return null;
        }

        // Safe JSON loader that never throws; returns null on empty/malformed content
        async function fetchJsonSafe(url){
          if(!url) return null;
          try{
            const res = await fetch(url, { cache:'no-store' });
            if(!res.ok) return null;
            const text = await res.text();
            if(!text || !text.trim()) return null;
            try{ return JSON.parse(text); }catch{ return null; }
          }catch{ return null; }
        }

        // sessionStorage-backed cache for small JSONs (taxonomy/family). Falls back to network on quota errors.
        async function fetchJsonCached(url, keyPrefix='fdx'){
          if(!url) return null; const key=`${keyPrefix}:${url}`;
          try{ const raw=sessionStorage.getItem(key); if(raw){ try{ return JSON.parse(raw); }catch{} } }catch{}
          const data = await fetchJsonSafe(url);
          try{ sessionStorage.setItem(key, JSON.stringify(data)); }catch{}
          return data;
        }

        async function loadTypes(){
          const baseDir = location.pathname.replace(/[^/]+$/, '');
          const idxPath = await resolve(['data/index.json','./data/index.json',baseDir+'data/index.json',baseDir+'../data/index.json','/data/index.json']);
          const flagsPath = await resolve(['data/species_habitat_flags.json','./data/species_habitat_flags.json',baseDir+'data/species_habitat_flags.json',baseDir+'../data/species_habitat_flags.json','/data/species_habitat_flags.json']);
          const idata = idxPath ? await fetchJsonSafe(idxPath) : null;
          const fdata = flagsPath ? await fetchJsonSafe(flagsPath) : null;
          const items = Array.isArray(idata?.items) ? idata.items : (Array.isArray(idata) ? idata : (Array.isArray(idata?.species) ? idata.species : []));
          const getSpecCode = (it)=> String(it.spec_code || it.SpecCode || it.code || it.id || '');
          const codesInIndex = new Set(items.map(getSpecCode).filter(Boolean));
          const flagsRows = Array.isArray(fdata) ? fdata : (Array.isArray(fdata?.rows) ? fdata.rows : []);
          const flagsByCode = new Map();
          for(const r of flagsRows){ const k = String(r.SpecCode ?? r.spec_code ?? r.code ?? '').trim(); if(k) flagsByCode.set(k, r); }
          const truthy = (v)=> v===true || v===1 || v==='1' || v==='true' || v==='TRUE' || v==='Y' || v==='y';
          const countFor = ({category, water, habitat})=>{
            const catFlag = CATEGORY_FLAG[(category||'').toLowerCase()];
            let count=0; flagsByCode.forEach((row,code)=>{
              if(!codesInIndex.has(String(code))) return;
              if(catFlag && !truthy(row[catFlag])) return;
              if(water && !truthy(row['water_'+water])) return;
              if(habitat && !truthy(row[habitat])) return;
              count++;
            }); return count;
          };

          const url = new URL(location.href); const category = (url.searchParams.get('category')||'').toLowerCase(); const water=(url.searchParams.get('water')||'').toLowerCase(); const habitat=(url.searchParams.get('habitat')||'').toLowerCase(); const mode=(url.searchParams.get('mode')||'').toLowerCase(); const groupParam=url.searchParams.get('group')||'';

          // Level 1: categories
          if(!category){
            document.getElementById('title').textContent = 'Browse by Category';
            document.getElementById('intro').textContent = 'Pick a top-level category to continue.';
            const cats=['game','commercial','bait'];
            grid.innerHTML = cats.map(c=>{
              const cnt = countFor({category:c});
              const label = c.charAt(0).toUpperCase()+c.slice(1);
              return card(`types.html?category=${encodeURIComponent(c)}`, 'icons/fish.svg', label, `${cnt} species`);
            }).join('');
            return;
          }

          // Level 2: water types
          if(category && !water){
            document.getElementById('title').textContent = `Browse ${category} • Water type`;
            document.getElementById('intro').textContent = 'Choose a water type';
            const waters=['fresh','brackish','salt'];
            grid.innerHTML = waters.map(w=>{
              const label = (w==='fresh'?'Freshwater':w==='salt'?'Saltwater':'Brackish');
              const cnt = countFor({category, water:w});
              return card(`types.html?category=${encodeURIComponent(category)}&water=${encodeURIComponent(w)}`, 'icons/fish.svg', label, `${cnt} species`);
            }).join('');
            return;
          }

          // Level 3: choose how to browse (mode chooser)
          if(category && water && !habitat && !mode){
            document.getElementById('title').textContent = `Browse ${category} • ${water==='fresh'?'Freshwater':water==='salt'?'Saltwater':'Brackish'}`;
            document.getElementById('intro').textContent = 'Choose how you want to browse';
            const byHabHref = `types.html?category=${encodeURIComponent(category)}&water=${encodeURIComponent(water)}&mode=habitat`;
            const byTypeHref = `types.html?category=${encodeURIComponent(category)}&water=${encodeURIComponent(water)}&mode=type`;
            grid.innerHTML = [
              card(byHabHref, 'icons/fish.svg', 'Browse by habitat', 'Pick a habitat and then see matching species'),
              card(byTypeHref, 'icons/fish.svg', 'Browse by type', 'See groups by genus common name')
            ].join('');
            return;
          }

          // Level 4: habitats (when mode=habitat)
          if(category && water && !habitat && mode==='habitat'){
            document.getElementById('title').textContent = `Browse ${category} • ${water==='fresh'?'Freshwater':water==='salt'?'Saltwater':'Brackish'} habitats`;
            document.getElementById('intro').textContent = 'Pick a habitat';
            const habitats = WATER_HABITATS[water] || [];
            grid.innerHTML = habitats.map(h=>{
              const pretty = h.replace(/_/g,' ').replace(/\b\w/g, s=>s.toUpperCase());
              const cnt = countFor({category, water, habitat:h});
              return card(`type-results.html?category=${encodeURIComponent(category)}&water=${encodeURIComponent(water)}&habitat=${encodeURIComponent(h)}`, 'icons/fish.svg', pretty, `${cnt} species`);
            }).join('');
            return;
          }

          // Level 4 (alternative): Types (when mode=type)
          if(category && water && mode==='type'){
            document.getElementById('title').textContent = `Browse ${category} • ${water==='fresh'?'Freshwater':water==='salt'?'Saltwater':'Brackish'} types`;
            document.getElementById('intro').textContent = groupParam ? `Pick a subtype in ${groupParam}` : 'Pick a type (genus common name) to see matching species';

            // Try fast pre-built type index first for instant loads
            let fast = null; try{ fast = await fetchJsonCached(`data/fast_types.${encodeURIComponent(category)}.${encodeURIComponent(water)}.json`, 'fdx-fast'); }catch{}

            if(fast && Array.isArray(fast.types)){
              const typeMap = new Map();
              const typeGenera = new Map();
              for(const t of fast.types){
                const label = String(t.label||'').trim(); if(!label) continue;
                const count = Array.isArray(t.codes)? t.codes.length : (t.count||0);
                if(count<=0) continue;
                typeMap.set(label, (typeMap.get(label)||0)+count);
                const gens = Array.isArray(t.genera)? t.genera:[];
                if(!typeGenera.has(label)) typeGenera.set(label, new Set());
                for(const g of gens){ if(g) typeGenera.get(label).add(g); }
              }

              // custom groups rendering using typeMap/typeGenera
              let groupsCfg=null; try{ groupsCfg = await fetchJsonCached('data/type_groups.json','fdx-cfg'); }catch{}
              if(groupParam && groupsCfg && Array.isArray(groupsCfg.groups)){
                const grp = groupsCfg.groups.find(g=>String(g.name||'').toLowerCase()===groupParam.toLowerCase());
                if(grp){
                  // Build allowed genera from config (Family -> expand by curated JSON; Genus -> itself; Label -> from typeGenera)
                  const allowedGenera = new Set(); const asObj=(t)=> (t && typeof t==='object'? t : { Label:String(t||'') });
                  for(const raw of (Array.isArray(grp.types)? grp.types:[])){
                    const t=asObj(raw); const fam=t.Family||t.family; const gen=t.Genus||t.genus; const lbl=t.Label;
                    if(gen){ allowedGenera.add(String(gen).trim()); continue; }
                    if(fam){ const famUrl = await resolve([`data/game_family_json/${encodeURIComponent(String(fam).trim())}.json`]); if(famUrl){ try{ const famJson=await fetchJsonCached(famUrl,'fdx-fam'); const gens=Array.isArray(famJson?.genera)? famJson.genera:[]; for(const ge of gens){ const gsci=String(ge?.scientific||'').trim(); if(gsci) allowedGenera.add(gsci); } }catch{} } continue; }
                    if(lbl){ const gs = typeGenera.get(String(lbl)) || new Set(); gs.forEach(g=>allowedGenera.add(g)); }
                  }
                  // Build entries limited to allowedGenera using fast file counts
                  const subCounts = new Map();
                  for(const t of fast.types){ const label=String(t.label||'').trim(); if(!label) continue; const gens=Array.isArray(t.genera)? t.genera:[]; const match = gens.some(g=>allowedGenera.has(g)); if(!match) continue; const cnt=Array.isArray(t.codes)? t.codes.length : (t.count||0); subCounts.set(label, (subCounts.get(label)||0)+cnt); }
                  const entries = Array.from(subCounts.entries()).sort((a,b)=> a[0].localeCompare(b[0]));
                  if(entries.length===0){ grid.innerHTML = `<article class="card"><div class="icon"><img src="icons/fish.svg"/></div><div><div class="group-label">No subtypes found</div><div class="group-description">No matching subtypes for ${grp.name} in this selection.</div></div></article>`; return; }
                  grid.innerHTML = entries.map(([name,count])=>{
                    const genera = Array.from(typeGenera.get(name)||[]).sort().join(',');
                    const href = `type-results.html?category=${encodeURIComponent(category)}&water=${encodeURIComponent(water)}&type=${encodeURIComponent(name)}&genera=${encodeURIComponent(genera)}&group=${encodeURIComponent(grp.name)}`;
                    return card(href, grp.icon||'icons/fish.svg', name, `${count} species`);
                  }).join('');
                  return;
                }
              }

              // Top-level with groups
              const typesArr = Array.from(typeMap.entries());
              const typesSet = new Set(typesArr.map(([n])=>n));
              const groupCards=[]; const groupedTypes = new Set();
              // reuse groupsCfg if already loaded above; otherwise attempt load
              if(!groupsCfg){ try{ groupsCfg = await fetchJsonCached('data/type_groups.json','fdx-cfg'); }catch{} }
              if(groupsCfg && Array.isArray(groupsCfg.groups)){
                for(const g of groupsCfg.groups){
                  // compute sum based on member types present
                  // Expand membership by looking up allowedGenera and then mapping back to labels
                  const allowedGenera=new Set(); const asObj=(t)=> (t && typeof t==='object'? t : { Label:String(t||'') });
                  for(const raw of (Array.isArray(g.types)? g.types:[])){
                    const t=asObj(raw); const fam=t.Family||t.family; const gen=t.Genus||t.genus; const lbl=t.Label;
                    if(gen){ allowedGenera.add(String(gen).trim()); continue; }
                    if(fam){ const famUrl = await resolve([`data/game_family_json/${encodeURIComponent(String(fam).trim())}.json`]); if(famUrl){ try{ const famJson=await fetchJsonCached(famUrl,'fdx-fam'); const gens=Array.isArray(famJson?.genera)? famJson.genera:[]; for(const ge of gens){ const gsci=String(ge?.scientific||'').trim(); if(gsci) allowedGenera.add(gsci); } }catch{} } continue; }
                    if(lbl){ const gs = typeGenera.get(String(lbl)) || new Set(); gs.forEach(x=>allowedGenera.add(x)); }
                  }
                  const groupTypeCounts = new Map();
                  for(const t of fast.types){ const label=String(t.label||'').trim(); if(!label) continue; const gens=Array.isArray(t.genera)? t.genera:[]; if(gens.some(g=>allowedGenera.has(g))){ const cnt=Array.isArray(t.codes)? t.codes.length : (t.count||0); groupTypeCounts.set(label, (groupTypeCounts.get(label)||0)+cnt); }
                  }
                  const sum = Array.from(groupTypeCounts.values()).reduce((a,b)=>a+b,0);
                  if(sum<=0) continue;
                  Array.from(groupTypeCounts.keys()).forEach(t=>groupedTypes.add(t));
                  const href = `types.html?category=${encodeURIComponent(category)}&water=${encodeURIComponent(water)}&mode=type&group=${encodeURIComponent(g.name||'Group')}`;
                  groupCards.push(card(href, g.icon||'icons/fish.svg', g.name||'Group', `${sum} species`));
                }
              }
              const ungrouped = typesArr.filter(([n])=> !groupedTypes.has(n)).sort((a,b)=> a[0].localeCompare(b[0]));
              const ungroupedCards = ungrouped.map(([name,count])=>{
                const genera = Array.from(typeGenera.get(name) || []).sort().join(',');
                const href = `type-results.html?category=${encodeURIComponent(category)}&water=${encodeURIComponent(water)}&type=${encodeURIComponent(name)}&genera=${encodeURIComponent(genera)}`;
                return card(href, 'icons/fish.svg', name, `${count} species`);
              });
              const allCards=[...groupCards, ...ungroupedCards];
              grid.innerHTML = allCards.length? allCards.join('') : `<article class=\"card\"><div class=\"icon\"><img src=\"icons/fish.svg\"/></div><div><div class=\"group-label\">No types found</div><div class=\"group-description\">This selection may not be present in your data yet.</div></div></article>`;
              return;
            }

            // We will build genus -> common map exclusively from curated family JSONs
            const genusToCommon = new Map();
            const genusToFamily = new Map();

            // Read family from index to locate curated JSON file
            const getFamilyName = (it)=> (it.family||it.Family||it.FAMILY||it.family_name||it.FamilyName||'');

            // Build filtered species by flags (category+water)
            const truthy = (v)=> v===true || v===1 || v==='1' || v==='true' || v==='TRUE' || v==='Y' || v==='y';
            const catFlag = CATEGORY_FLAG[category]||'';
            const getGenus = (it)=>{
              const sci = (it.scientific_name||it.SciName||it.sciname||'').toString();
              return sci.includes(' ')? sci.split(/\s+/)[0] : '';
            };

            const filtered = items.filter(it=>{
              const code = getSpecCode(it);
              if(!code) return false;
              const row = flagsByCode.get(String(code));
              if(row){
                if(catFlag && !truthy(row[catFlag])) return false;
                if(water && !truthy(row['water_'+water])) return false;
                return true;
              }
              // Fallback to index fields when flags are missing
              const uses = Array.isArray(it.importances)? it.importances.map(x=>String(x).toLowerCase()) : [];
              const waters = Array.isArray(it.water_types)? it.water_types.map(x=>String(x).toLowerCase()) : [];
              const catOk = !category || uses.includes(category);
              const waterOk = !water || waters.includes(water);
              return catOk && waterOk;
            });

            // Build genus commons from curated family JSONs
            // Step 1: try using family names from index (fast when they match curated filenames)
            try{
              const famSet = new Set(filtered.map(getFamilyName).filter(Boolean));
              for(const fam of famSet){
                const famUrl = await resolve([`data/game_family_json/${encodeURIComponent(fam)}.json`]);
                if(!famUrl) continue;
                const famJson = await fetchJsonCached(famUrl,'fdx-fam');
                const gens = Array.isArray(famJson?.genera)? famJson.genera:[];
                for(const ge of gens){
                  const sci = String(ge?.scientific||'').trim();
                  const com = String(ge?.common||'').trim();
                  if(sci){
                    genusToFamily.set(sci, fam);
                    if(com && !genusToCommon.has(sci)) genusToCommon.set(sci, com);
                  }
                }
              }
            }catch{}

            // Step 2: if coverage is poor (e.g., index family names don't match curated files),
            // fall back to scanning curated families via a lightweight manifest and map only needed genera.
            try{
              const neededGenera = new Set();
              for(const it of filtered){ const s=(it.scientific_name||'').toString(); if(!s) continue; const g=s.includes(' ')? s.split(/\s+/)[0] : ''; if(g && !genusToCommon.has(g)) neededGenera.add(g); }
              if(neededGenera.size){
                const manifestUrl = await resolve(['data/game_family_json/_index.json']);
                if(manifestUrl){
                  const manifest = await fetchJsonCached(manifestUrl,'fdx-fam');
                  const files = Array.isArray(manifest?.files)? manifest.files : [];
                  for(const file of files){
                    if(!neededGenera.size) break;
                    const famUrl = await resolve([`data/game_family_json/${file}`]);
                    if(!famUrl) continue;
                    try{
                      const famJson = await fetchJsonCached(famUrl,'fdx-fam');
                      const gens = Array.isArray(famJson?.genera)? famJson.genera:[];
                      for(const ge of gens){
                        const sci = String(ge?.scientific||'').trim();
                        if(!sci || !neededGenera.has(sci)) continue;
                        const com = String(ge?.common||'').trim();
                        if(com){ genusToCommon.set(sci, com); neededGenera.delete(sci); }
                      }
                    }catch{}
                  }
                }
              }
            }catch{}

            // Group into types by curated genus common name ONLY (no scientific or family fallbacks)
            const typeMap = new Map(); // typeName -> count
            const typeMembers = new Map(); // typeName -> Set(spec_code)
            const typeGenera = new Map(); // typeName -> Set(genus)
            for(const it of filtered){
              const genus = getGenus(it);
              if(!genus) continue;
              const common = genusToCommon.get(genus);
              if(!common) continue; // skip genera without curated common name
              const typeName = String(common).trim();
              typeMap.set(typeName, (typeMap.get(typeName)||0)+1);
              if(!typeMembers.has(typeName)) typeMembers.set(typeName, new Set());
              typeMembers.get(typeName).add(getSpecCode(it));
              if(!typeGenera.has(typeName)) typeGenera.set(typeName, new Set());
              typeGenera.get(typeName).add(genus);
            }

            // Optionally load custom groupings
            let groupsCfg=null; try{ groupsCfg = await fetchJsonCached('data/type_groups.json','fdx-cfg'); }catch{}

            // If viewing a specific group, render only its subtypes (expand Family -> member genera; Genus -> single genus)
            if(groupParam && groupsCfg && Array.isArray(groupsCfg.groups)){
              const grp = groupsCfg.groups.find(g=>String(g.name||'').toLowerCase()===groupParam.toLowerCase());
              if(grp){
                const allowedGenera = new Set();
                const typesList = Array.isArray(grp.types)? grp.types:[];
                // Helper to normalize entry
                const asObj = (t)=> (t && typeof t==='object' ? t : { Label:String(t||'') });
                for(const raw of typesList){
                  const t = asObj(raw);
                  const fam = t.Family || t.family;
                  const gen = t.Genus || t.genus;
                  const lbl = t.Label;
                  if(gen){ allowedGenera.add(String(gen).trim()); continue; }
                  if(fam){
                    const famUrl = await resolve([`data/game_family_json/${encodeURIComponent(String(fam).trim())}.json`]);
                    if(famUrl){ try{ const famJson = await fetchJsonCached(famUrl,'fdx-fam'); const gens=Array.isArray(famJson?.genera)? famJson.genera:[]; for(const ge of gens){ const gsci=String(ge?.scientific||'').trim(); if(gsci) allowedGenera.add(gsci); } }catch{} }
                    continue;
                  }
                  if(lbl){
                    // Legacy string label: include all genera currently mapped to that type label
                    const gens = typeGenera.get(String(lbl)) || new Set();
                    gens.forEach(g=>allowedGenera.add(g));
                  }
                }

                // Build subtype map restricted to allowedGenera
                const subTypeMap = new Map(); // label -> count
                const subTypeGenera = new Map(); // label -> Set(genus)
                for(const it of filtered){
                  const g = getGenus(it); if(!g || !allowedGenera.has(g)) continue;
                  const label = genusToCommon.get(g); if(!label) continue;
                  subTypeMap.set(label, (subTypeMap.get(label)||0)+1);
                  if(!subTypeGenera.has(label)) subTypeGenera.set(label, new Set());
                  subTypeGenera.get(label).add(g);
                }

                const entries = Array.from(subTypeMap.entries()).sort((a,b)=> a[0].localeCompare(b[0]));
                if(entries.length===0){ grid.innerHTML = `<article class=\"card\"><div class=\"icon\"><img src=\"icons/fish.svg\"/></div><div><div class=\"group-label\">No subtypes found</div><div class=\"group-description\">No matching subtypes for ${grp.name} in this selection.</div></div></article>`; return; }
                grid.innerHTML = entries.map(([name,count])=>{
                  const genera = Array.from(subTypeGenera.get(name) || []).sort().join(',');
                  const href = `type-results.html?category=${encodeURIComponent(category)}&water=${encodeURIComponent(water)}&type=${encodeURIComponent(name)}&genera=${encodeURIComponent(genera)}&group=${encodeURIComponent(grp.name)}`;
                  return card(href, grp.icon||'icons/fish.svg', name, `${count} species`);
                }).join('');
                return;
              }
            }

            // Top-level: show group cards for configured groups (sum of their member counts), then ungrouped types
            const typesArr = Array.from(typeMap.entries());
            const typesSet = new Set(typesArr.map(([n])=>n));
            const groupCards=[]; const groupedTypes = new Set();
            if(groupsCfg && Array.isArray(groupsCfg.groups)){
              for(const g of groupsCfg.groups){
                const typesList = Array.isArray(g.types)? g.types:[];
                const allowedGenera = new Set();
                const asObj=(t)=> (t && typeof t==='object' ? t : { Label:String(t||'') });
                for(const raw of typesList){
                  const t=asObj(raw); const fam=t.Family||t.family; const gen=t.Genus||t.genus; const lbl=t.Label;
                  if(gen){ allowedGenera.add(String(gen).trim()); continue; }
                  if(fam){
                    const famUrl = await resolve([`data/game_family_json/${encodeURIComponent(String(fam).trim())}.json`]);
                    if(famUrl){ try{ const famJson = await fetchJsonCached(famUrl,'fdx-fam'); const gens=Array.isArray(famJson?.genera)? famJson.genera:[]; for(const ge of gens){ const gsci=String(ge?.scientific||'').trim(); if(gsci) allowedGenera.add(gsci); } }catch{} }
                    continue;
                  }
                  if(lbl){ const gens = typeGenera.get(String(lbl)) || new Set(); gens.forEach(x=>allowedGenera.add(x)); }
                }
                // compute sum and member type names for this group
                const groupTypeCounts = new Map();
                for(const it of filtered){ const gname=getGenus(it); if(!gname || !allowedGenera.has(gname)) continue; const lbl=genusToCommon.get(gname); if(!lbl) continue; groupTypeCounts.set(lbl, (groupTypeCounts.get(lbl)||0)+1); }
                const memberTypes = Array.from(groupTypeCounts.keys());
                const sum = Array.from(groupTypeCounts.values()).reduce((a,b)=>a+b,0);
                if(sum<=0) continue;
                memberTypes.forEach(t=>groupedTypes.add(t));
                const href = `types.html?category=${encodeURIComponent(category)}&water=${encodeURIComponent(water)}&mode=type&group=${encodeURIComponent(g.name||'Group')}`;
                groupCards.push(card(href, g.icon||'icons/fish.svg', g.name||'Group', `${sum} species`));
              }
            }

            // Ungrouped types
            const ungrouped = typesArr.filter(([n])=> !groupedTypes.has(n)).sort((a,b)=> a[0].localeCompare(b[0]));
            const ungroupedCards = ungrouped.map(([name,count])=>{
              const genera = Array.from(typeGenera.get(name) || []).sort().join(',');
              const href = `type-results.html?category=${encodeURIComponent(category)}&water=${encodeURIComponent(water)}&type=${encodeURIComponent(name)}&genera=${encodeURIComponent(genera)}`;
              return card(href, 'icons/fish.svg', name, `${count} species`);
            });

            const allCards = [...groupCards, ...ungroupedCards];
            if(allCards.length===0){
              grid.innerHTML = `<article class=\"card\"><div class=\"icon\"><img src=\"icons/fish.svg\"/></div><div><div class=\"group-label\">No types found</div><div class=\"group-description\">This selection may not be present in your data yet.</div></div></article>`;
              return;
            }
            grid.innerHTML = allCards.join('');
            return;
          }

          // Fallback
          grid.innerHTML = `<article class=\"card\"><div class=\"icon\"><img src=\"icons/fish.svg\"/></div><div><div class=\"group-label\">Nothing to show</div><div class=\"group-description\">Select a category to begin.</div></div></article>`;
        }

        loadTypes().catch(err => {
          console.error(err);
          grid.innerHTML = `<article class=\"card\"><div class=\"icon\"><img src=\"icons/fish.svg\"/></div><div><div class=\"group-label\">Unable to load types</div><div class=\"group-description\">${String(err.message||err)}</div></div></article>`;
        });
      </script>
    </main>
  </body>
</html>
